name: Boundary07
options:
  bundleIdPrefix: com.boundary07
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGNING_ALLOWED: "NO"
targets:
  Boundary07:
    type: application
    platform: iOS
    sources:
      - path: Boundary07
        excludes: [Resources]
    resources:
      - path: Boundary07/Resources/Web
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.boundary07.local
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: Boundary 07
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIRequiresFullScreen: "YES"
        INFOPLIST_KEY_UIFileSharingEnabled: "YES"
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: "YES"
    info:
      path: Boundary07/Generated-Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
  Boundary07Tests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: Boundary07
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
schemes:
  Boundary07:
    build:
      targets:
        Boundary07: all
        Boundary07Tests: [test]
    test:
      targets: [Boundary07Tests]
