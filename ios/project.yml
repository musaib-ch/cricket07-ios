name: Cricket07Foundation
options:
  bundleIdPrefix: com.cricket07foundation
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGNING_ALLOWED: "NO"
targets:
  Cricket07Foundation:
    type: application
    platform: iOS
    sources:
      - path: Cricket07
      - path: ../runtime/runtime.c
      - path: ../runtime/interp.c
    settings:
      base:
        SWIFT_OBJC_BRIDGING_HEADER: Cricket07/RuntimeBridge.h
        HEADER_SEARCH_PATHS: "$(SRCROOT)/../runtime $(SRCROOT)/../host"
        PRODUCT_BUNDLE_IDENTIFIER: com.cricket07foundation.app
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIRequiresFullScreen: "YES"
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: "YES"
        INFOPLIST_KEY_UIFileSharingEnabled: "YES"
        SWIFT_EMIT_LOC_STRINGS: "YES"
