name: Native iOS app shell
on:
  push:
    branches: [feature/ios-native-foundation]
    paths: ['ios/**', '.github/workflows/ios-app-shell.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        sdk: [iphonesimulator, iphoneos]
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: cd ios && xcodegen generate --spec project.yml
      - name: Compile app
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.sdk }}" = "iphoneos" ]; then DEST="generic/platform=iOS"; else DEST="generic/platform=iOS Simulator"; fi
          xcodebuild -project ios/Cricket07Foundation.xcodeproj -scheme Cricket07Foundation -sdk "${{ matrix.sdk }}" -destination "$DEST" -derivedDataPath "$RUNNER_TEMP/Derived" CODE_SIGNING_ALLOWED=NO build
      - name: Package unsigned diagnostic IPA
        if: matrix.sdk == 'iphoneos'
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/Derived/Build/Products/Debug-iphoneos/Cricket07Foundation.app"
          test -d "$APP"
          # Provide a valid ad-hoc Mach-O signature for tools that subsequently
          # replace it with a development-team signature (for example AltStore).
          # This is NOT an installable Apple provisioning signature.
          codesign --force --sign - --timestamp=none "$APP"
          codesign --verify --strict --verbose=2 "$APP"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qr "$GITHUB_WORKSPACE/Cricket07Foundation-diagnostics-adhoc.ipa" Payload)
          echo "Ad-hoc signed diagnostics only: AltStore must re-sign with a valid development identity. No Cricket 07 gameplay." >> "$GITHUB_STEP_SUMMARY"
      - name: Upload diagnostic IPA
        if: matrix.sdk == 'iphoneos'
        uses: actions/upload-artifact@v4
        with:
          name: Cricket07Foundation-diagnostics-adhoc
          path: Cricket07Foundation-diagnostics-adhoc.ipa
          if-no-files-found: error
          retention-days: 14
