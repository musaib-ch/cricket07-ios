name: Cricket 07 iOS engine static library

on:
  push:
    branches: [feature/ios-native-foundation]
    paths:
      - 'runtime/**'
      - 'host/**'
      - 'ios/Cricket07/ControllerInputQueue.*'
      - 'ios/Cricket07/ControllerInputPump.*'
      - 'ios/engine/ControllerDirectInputAdapter.*'
      - 'ios/engine/EngineRenderBackend.*'
      - 'ios/engine/EngineBootstrap.*'
      - 'ios/engine/PEPreflight.*'
      - 'ios/engine/PEImportsPreflight.*'
      - 'ios/engine/PELoadGate.*'
      - 'ios/engine/PEImportPlan.*'
      - 'ios/engine/PEImageStage.*'
      - '.github/workflows/ios-engine-library.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engine-library:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        sdk: [iphoneos, iphonesimulator]
    steps:
      - uses: actions/checkout@v4
      - name: Compile native runtime and compatible host objects
        shell: bash
        run: |
          set -euo pipefail
          SDK="${{ matrix.sdk }}"
          SDKROOT="$(xcrun --sdk "$SDK" --show-sdk-path)"
          if [ "$SDK" = iphoneos ]; then
            TARGET=arm64-apple-ios17.0
          else
            TARGET=arm64-apple-ios17.0-simulator
          fi
          OUT="$RUNNER_TEMP/engine-$SDK"
          mkdir -p "$OUT/objects"
          SOURCES=(
            runtime/runtime.c runtime/interp.c
            host/com.c host/core.c host/import_registry.c host/d3d8.c host/dinput.c host/dsound.c
            host/input.c host/kernel32.c host/main.c host/misc.c host/pshader.c
            host/render_rec.c host/texconv.c host/user32.c host/vshader.c
            host/watch.c host/web.c
            ios/Cricket07/FrameQueue.c
            ios/Cricket07/ControllerInputQueue.c
            ios/Cricket07/ControllerInputPump.c
            ios/engine/ControllerDirectInputAdapter.c
            ios/engine/EngineRenderBackend.c
            ios/engine/EngineBootstrap.c
            ios/engine/PEPreflight.c
            ios/engine/PEImportsPreflight.c
            ios/engine/PELoadGate.c
            ios/engine/PEImportPlan.c
            ios/engine/PEImageStage.c
          )
          for src in "${SOURCES[@]}"; do
            object="$OUT/objects/${src//\//_}.o"
            echo "::group::Compiling $src"
            xcrun clang -target "$TARGET" -isysroot "$SDKROOT" \
              -std=gnu11 -O1 -frounding-math -Wno-unused-function \
              -DCRICKET07_IOS_GAME -DRC_IOS_FRAME_TRANSPORT=1 \
              -Iruntime -Ihost -Iios/Cricket07 -Iios/engine -c "$src" -o "$object"
            echo "::endgroup::"
            xcrun lipo -info "$object"
          done
          # Verify the actual Present object references the adapter, and that
          # the adapter and its real DirectInput sink are defined in this archive.
          xcrun nm -u "$OUT/objects/host_main.c.o" > "$OUT/launcher-undefined.txt"
          xcrun nm -g "$OUT/objects/host_import_registry.c.o" > "$OUT/import-registry-symbols.txt"
          grep -Fq '_host_register_import_handlers' "$OUT/launcher-undefined.txt"
          grep -Fq '_host_register_import_handlers' "$OUT/import-registry-symbols.txt"
          xcrun nm -u "$OUT/objects/host_d3d8.c.o" > "$OUT/present-undefined.txt"
          xcrun nm -g "$OUT/objects/ios_engine_ControllerDirectInputAdapter.c.o" > "$OUT/adapter-symbols.txt"
          xcrun nm -g "$OUT/objects/host_input.c.o" > "$OUT/input-symbols.txt"
          xcrun nm -u "$OUT/objects/host_render_rec.c.o" > "$OUT/recorder-undefined.txt"
          xcrun nm -g "$OUT/objects/ios_engine_EngineRenderBackend.c.o" > "$OUT/backend-selection-symbols.txt"
          xcrun nm -g "$OUT/objects/host_d3d8.c.o" > "$OUT/d3d-backend-symbols.txt"
          xcrun nm -g "$OUT/objects/host_render_rec.c.o" > "$OUT/recorder-backend-symbols.txt"
          xcrun nm -g "$OUT/objects/ios_Cricket07_FrameQueue.c.o" > "$OUT/frame-queue-symbols.txt"
          cat "$OUT/present-undefined.txt"
          cat "$OUT/adapter-symbols.txt"
          cat "$OUT/input-symbols.txt"
          cat "$OUT/recorder-undefined.txt"
          cat "$OUT/frame-queue-symbols.txt"
          cat "$OUT/backend-selection-symbols.txt"
          grep -Fq '_cricket07_controller_pump_directinput' "$OUT/present-undefined.txt"
          grep -Fq '_cricket07_controller_pump_directinput' "$OUT/adapter-symbols.txt"
          grep -Fq '_input_key_hid' "$OUT/input-symbols.txt"
          # The engine archive must use the iOS recorder transport, never
          # desktop wgpu. Verify both producer and mailbox definition.
          grep -Fq '_cricket07_frame_queue_publish' "$OUT/recorder-undefined.txt"
          grep -Fq '_cricket07_frame_queue_publish' "$OUT/frame-queue-symbols.txt"
          grep -Fq '_cricket07_engine_select_ios_recorder' "$OUT/backend-selection-symbols.txt"
          xcrun nm -g "$OUT/objects/ios_engine_EngineBootstrap.c.o" > "$OUT/bootstrap-symbols.txt"
          grep -Fq '_cricket07_engine_prepare_host' "$OUT/bootstrap-symbols.txt"
          grep -Fq '_cricket07_engine_host_prepared' "$OUT/bootstrap-symbols.txt"
          grep -Fq '_cricket07_engine_prepare_guest' "$OUT/bootstrap-symbols.txt"
          grep -Fq '_cricket07_engine_guest_cpu' "$OUT/bootstrap-symbols.txt"
          grep -Fq '_cricket07_engine_load_user_executable' "$OUT/bootstrap-symbols.txt"
          grep -Fq '_cricket07_engine_resolve_loaded_entrypoint' "$OUT/bootstrap-symbols.txt"
          xcrun nm -g "$OUT/objects/ios_engine_PEPreflight.c.o" | grep -Fq '_cricket07_pe32_preflight'
          xcrun nm -g "$OUT/objects/ios_engine_PEImportsPreflight.c.o" | grep -Fq '_cricket07_pe32_imports_preflight'
          xcrun nm -g "$OUT/objects/ios_engine_PELoadGate.c.o" | grep -Fq '_cricket07_pe32_load_gate'
          xcrun nm -u "$OUT/objects/runtime_runtime.c.o" | grep -Fq '_cricket07_pe32_load_gate'
          xcrun nm -g "$OUT/objects/ios_engine_PEImportPlan.c.o" | grep -Fq '_cricket07_pe32_stage_imports'
          xcrun nm -u "$OUT/objects/runtime_runtime.c.o" | grep -Fq '_cricket07_pe32_stage_imports'
          xcrun nm -g "$OUT/objects/ios_engine_PEImageStage.c.o" | grep -Fq '_cricket07_pe32_stage_image'
          xcrun nm -u "$OUT/objects/runtime_runtime.c.o" | grep -Fq '_cricket07_pe32_stage_image'
          xcrun nm -g "$OUT/objects/runtime_runtime.c.o" > "$OUT/runtime-symbols.txt"
          grep -Fq '_runtime_try_init' "$OUT/runtime-symbols.txt"
          grep -Fq '_g_render' "$OUT/d3d-backend-symbols.txt"
          grep -Fq '_g_render_gpu' "$OUT/recorder-backend-symbols.txt"
          if grep -Eq '_gpu_(exec|init_native)' "$OUT/recorder-undefined.txt"; then
            echo 'Engine recorder unexpectedly references desktop GPU' >&2
            exit 1
          fi
          xcrun libtool -static -o "$OUT/libcricket07host.a" "$OUT"/objects/*.o
          xcrun lipo -info "$OUT/libcricket07host.a"
          xcrun ar -t "$OUT/libcricket07host.a" > "$OUT/objects.txt"
          cp "$OUT/libcricket07host.a" "libcricket07host-$SDK.a"
          cp "$OUT/objects.txt" "libcricket07host-$SDK-objects.txt"
          {
            echo "## Native engine static archive ($SDK)"
            echo "Compiled ${#SOURCES[@]} C translation units for $TARGET."
            echo "Archive: libcricket07host-$SDK.a"
            echo
            echo "Includes iOS frame mailbox, recorder transport, and a guarded host bootstrap preparation API (no desktop GPU executor)."
            echo "This is an unlinked intermediate library, NOT a playable engine or IPA."
            echo "Still missing: generated Cricket 07 game functions, live Metal command coverage, iOS game lifecycle integration, game assets, and final app linkage."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: cricket07-engine-library-${{ matrix.sdk }}
          path: |
            libcricket07host-${{ matrix.sdk }}.a
            libcricket07host-${{ matrix.sdk }}-objects.txt
          if-no-files-found: error
          retention-days: 14
