name: iOS render recorder transport probe
on:
  push:
    branches: [feature/ios-native-foundation]
    paths:
      - 'host/render_rec.c'
      - 'ios/Cricket07/FrameQueue.*'
      - '.github/workflows/ios-render-recorder-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        sdk: [iphoneos, iphonesimulator]
    steps:
      - uses: actions/checkout@v4
      - name: Cross-compile iOS recorder and frame queue
        shell: bash
        run: |
          set -euo pipefail
          SDK="${{ matrix.sdk }}"
          SDKROOT="$(xcrun --sdk "$SDK" --show-sdk-path)"
          if [ "$SDK" = iphoneos ]; then
            TARGET=arm64-apple-ios17.0
          else
            TARGET=arm64-apple-ios17.0-simulator
          fi
          mkdir -p "$RUNNER_TEMP/iosrec"
          xcrun clang -target "$TARGET" -isysroot "$SDKROOT" -std=gnu11 \
            -DRC_IOS_FRAME_TRANSPORT=1 -Iruntime -Ihost \
            -c host/render_rec.c -o "$RUNNER_TEMP/iosrec/render_rec.o"
          xcrun clang -target "$TARGET" -isysroot "$SDKROOT" -std=gnu11 \
            -Iios/Cricket07 -c ios/Cricket07/FrameQueue.c \
            -o "$RUNNER_TEMP/iosrec/FrameQueue.o"
          xcrun lipo -info "$RUNNER_TEMP/iosrec/render_rec.o"
          # iOS recorder must never depend on desktop wgpu entry points.
          if xcrun nm -u "$RUNNER_TEMP/iosrec/render_rec.o" | grep -E 'gpu_init_native|gpu_exec'; then
            echo "iOS recorder still references desktop GPU initialization/execution" >&2
            exit 1
          fi
          xcrun nm -u "$RUNNER_TEMP/iosrec/render_rec.o" | grep -q 'cricket07_frame_queue_publish'
          echo "iOS recorder transport compiles without desktop GPU dependencies. Synchronous GPU readback remains unsupported; no game engine is linked." >> "$GITHUB_STEP_SUMMARY"
